name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      KILL_SWITCH_ENABLED: "false"
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      ADMIN_API_TOKEN: ci-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check app tests
      - name: Ruff format
        run: ruff format --check app tests
      - name: Mypy
        run: mypy app
      - name: Pytest + coverage
        env:
          # Keep tests on an isolated in-memory DB even if job-level DATABASE_URL is set.
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest --cov=app.risk --cov=app.execution --cov=app.portfolio --cov=app.strategies \
            --cov-report=term-missing --cov-fail-under=70
      - name: Alembic upgrade
        env:
          # Fresh file DB dedicated to migration validation (never share with pytest).
          DATABASE_URL: "sqlite+aiosqlite:///./migrate-ci.db"
        run: |
          rm -f migrate-ci.db
          alembic upgrade head
      - name: Migration heads consistency
        run: alembic heads | tee /tmp/alembic-heads.txt && test "$(wc -l < /tmp/alembic-heads.txt)" -eq 1
      - name: Secret scan (basic)
        run: |
          if rg -n --hidden -g '!.git/**' -g '!*.md' -g '!.env.example' -g '!frontend/package-lock.json' \
            -e 'BEGIN (RSA |OPENSSH )?PRIVATE KEY' -e 'sk_live_' -e 'AKIA[0-9A-Z]{16}' .; then
            echo "Potential secret material found" >&2
            exit 1
          fi
          echo "Basic secret scan passed"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit/smoke tests
        run: npm run test --if-present
      - name: Production build
        run: npm run build
