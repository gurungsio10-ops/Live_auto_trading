name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      KILL_SWITCH_ENABLED: "false"
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      ADMIN_API_TOKEN: ci-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check app tests
      - name: Ruff format
        run: ruff format --check app tests
      - name: Mypy
        run: mypy app
      - name: Pytest + coverage
        env:
          # Keep tests on an isolated in-memory DB even if job-level DATABASE_URL is set.
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Alembic upgrade
        env:
          # Fresh file DB dedicated to migration validation (never share with pytest).
          DATABASE_URL: "sqlite+aiosqlite:///./migrate-ci.db"
        run: |
          rm -f migrate-ci.db
          alembic upgrade head

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config >/dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
