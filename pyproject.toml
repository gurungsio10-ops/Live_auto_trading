[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-trading-bot"
version = "0.1.0"
description = "Project Atlas — gated paper/live trading system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "redis>=5.0.8",
  "ccxt>=4.3.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "respx>=0.21.1",
  "ruff>=0.6.0",
  "black>=24.8.0",
  "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Keep Decimal("...") constructors — intentional for money values (never float).
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",    # line length enforced by black
  "FURB157", # Decimal string form is intentional
  "E741",    # candle o/h/l/c shorthand is domain convention
  "UP042",   # str+Enum remains intentional for JSON serialization
  "B905",    # zip(strict=) not required for equal-length indicator series
  "SIM102",  # nested risk checks are clearer as written
  "SIM105",  # explicit try/except preferred for cancel paths
  "RUF012",  # ClassVar mutable defaults handled case-by-case
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
